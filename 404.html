<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
  (function () {
    var prefersDark = window.matchMedia &&
      window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', prefersDark ? 'blue' : 'aurora');
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Abyss Approaching</title>
<meta name="description" content="Go back to where you come from and tell everyone to leave.">
<link rel="icon" type="image/x-icon" href="favicon-anemo.ico" id="favicon">
<script>
  (function () {
    var isBlue = document.documentElement.getAttribute('data-theme') === 'blue';
    if (isBlue) document.getElementById('favicon').setAttribute('href', 'favicon-electro.ico');
  })();
</script>

<style>
@font-face {
  font-family: 'EavenFont';
  src: url('zh-cn.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}

:root {
  --frost:      #ffd6f7;
  --aurora:     #ff2fb0;
  --mint:       #ff6fd8;
  --teal:       #d4189e;
  --teal-deep:  #5c0e46;
  --abyss:      #140312;
  --ink:        #ffeefa;
  --ink-soft:   #d9a8ce;
  --ink-mute:   #9a6b90;
  --line-rgb:    212, 24, 158;
  --overlay-rgb: 18, 3, 16;

  --step-0:  clamp(1rem, 0.96rem + 0.2vw, 1.12rem);
  --step-1:  clamp(1.25rem, 1.16rem + 0.42vw, 1.5rem);
  --step-4:  clamp(2.8rem, 2rem + 4vw, 6.5rem);

  --display: 'EavenFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  --body: 'EavenFont', 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  --ease: cubic-bezier(0.22, 0.68, 0.24, 1);
}

:root[data-theme="blue"] {
  --frost:      #ffd0f2;
  --aurora:     #e619c8;
  --mint:       #ff5fd0;
  --teal:       #a4127f;
  --teal-deep:  #3d0a34;
  --abyss:      #100318;
  --ink:        #ffeaf9;
  --ink-soft:   #cf9fc6;
  --ink-mute:   #8f6289;
  --line-rgb:    164, 18, 127;
  --overlay-rgb: 16, 3, 24;
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
}

body {
  position: relative;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--body);
  color: var(--ink);
  background: var(--abyss) url('/image/404.png') center center / cover no-repeat fixed;
  overflow: hidden;
  transition: background-color 0.6s var(--ease);
}

body::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse at 50% 40%, rgba(var(--overlay-rgb), 0.35) 0%, rgba(var(--overlay-rgb), 0.72) 62%, rgba(var(--overlay-rgb), 0.92) 100%);
  z-index: 1;
}

.wrap {
  position: relative;
  z-index: 2;
  text-align: center;
  padding: clamp(1.5rem, 6vw, 3rem);
  max-width: 40rem;
}

.code {
  margin: 0;
  font-family: var(--display);
  font-size: var(--step-4);
  font-weight: 700;
  letter-spacing: 0.08em;
  line-height: 1;
  color: var(--frost);
  text-shadow:
    0 0 18px rgba(var(--line-rgb), 0.85),
    0 0 46px rgba(var(--line-rgb), 0.45);
  animation: flicker 4.5s ease-in-out infinite;
}

.rule {
  width: 5.5rem;
  height: 1px;
  margin: 1.1rem auto 1.4rem;
  background: linear-gradient(90deg, transparent, var(--teal), transparent);
  opacity: 0.8;
}

.title {
  margin: 0 0 0.6rem;
  font-family: var(--display);
  font-size: var(--step-1);
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--ink);
}

.msg {
  margin: 0 auto 2rem;
  max-width: 34ch;
  font-size: var(--step-0);
  line-height: 1.7;
  color: var(--ink-soft);
}

.home-link {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.75rem 1.6rem;
  border: 1px solid rgba(var(--line-rgb), 0.6);
  border-radius: 999px;
  color: var(--frost);
  text-decoration: none;
  font-size: var(--step-0);
  letter-spacing: 0.03em;
  background: rgba(var(--overlay-rgb), 0.35);
  backdrop-filter: blur(2px);
  transition: background-color 0.35s var(--ease), border-color 0.35s var(--ease),
              color 0.35s var(--ease), transform 0.35s var(--ease);
}

.home-link:hover,
.home-link:focus-visible {
  background: rgba(var(--line-rgb), 0.22);
  border-color: var(--aurora);
  color: var(--ink);
  transform: translateY(-2px);
}

.home-link svg {
  width: 1em;
  height: 1em;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
}

@keyframes flicker {
  0%, 100% { opacity: 1; }
  46%      { opacity: 1; }
  48%      { opacity: 0.72; }
  50%      { opacity: 1; }
  74%      { opacity: 1; }
  75%      { opacity: 0.85; }
  77%      { opacity: 1; }
}

@media (prefers-reduced-motion: reduce) {
  .code { animation: none; }
}
</style>
</head>
<body>

<div class="wrap">
  <p class="code">404</p>
  <div class="rule" aria-hidden="true"></div>
  <h1 class="title">The Abyss has corrupted this place</h1>
  <p class="msg">The page you're looking for has been devoured by the darkness.</p>
  <a class="home-link" href="/">
    <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
    Return
  </a>
</div>

</body>
</html>
