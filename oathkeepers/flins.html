    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const slides = document.querySelectorAll('.slide');
        const dotsContainer = document.getElementById('dots');
        const progressBar = document.getElementById('progressBar');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const slideshow = document.getElementById('slideshow');

        if (!slides.length) return;

        let currentIndex = 0;
        const intervalTime = 10000;
        let timer;
        let progressTimer;

        slides.forEach((_, i) => {
          const dot = document.createElement('div');
          dot.classList.add('dot');
          if (i === 0) dot.classList.add('active');
          dot.addEventListener('click', () => goToSlide(i));
          dotsContainer.appendChild(dot);
        });
        const dots = document.querySelectorAll('.dot');

        function showSlide(index) {
          slides.forEach(s => s.classList.remove('active'));
          dots.forEach(d => d.classList.remove('active'));
          currentIndex = (index + slides.length) % slides.length;
          slides[currentIndex].classList.add('active');
          dots[currentIndex].classList.add('active');
          restartProgress();
        }

        function nextSlide() { showSlide(currentIndex + 1); }
        function prevSlide() { showSlide(currentIndex - 1); }
        function goToSlide(i) { showSlide(i); }

        function restartProgress() {
          clearInterval(timer);
          clearInterval(progressTimer);
          progressBar.style.width = '0%';
          let width = 0;
          const stepTime = intervalTime / 100;
          progressTimer = setInterval(() => {
            width++;
            progressBar.style.width = width + '%';
          }, stepTime);
          timer = setInterval(nextSlide, intervalTime);
        }

        prevBtn.addEventListener('click', prevSlide);
        nextBtn.addEventListener('click', nextSlide);

        slideshow.addEventListener('mouseenter', () => {
          clearInterval(timer);
          clearInterval(progressTimer);
        });
        slideshow.addEventListener('mouseleave', restartProgress);

        let touchStartX = 0;
        slideshow.addEventListener('touchstart', e => touchStartX = e.touches[0].clientX);
        slideshow.addEventListener('touchend', e => {
          const diff = e.changedTouches[0].clientX - touchStartX;
          if (diff > 50) prevSlide();
          else if (diff < -50) nextSlide();
        });

        document.addEventListener('keydown', e => {
          if (e.key === 'ArrowRight') nextSlide();
          if (e.key === 'ArrowLeft') prevSlide();
        });

        restartProgress();
      });
    </script>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const music = document.getElementById('bgMusic');
        const toggleBtn = document.getElementById('musicToggle');
        let userPaused = false;

        function setIcon(playing) {
          toggleBtn.innerHTML = playing ? '&#9208;' : '&#9654;';
          toggleBtn.classList.toggle('muted', !playing);
          toggleBtn.title = playing ? 'Now playing' : 'Now paused';
        }

        function tryAutoplay() {
          const playPromise = music.play();
          if (playPromise !== undefined) {
            playPromise.then(() => {
              setIcon(true);
            }).catch(() => {
              setIcon(false);
              const resumeOnInteract = () => {
                if (!userPaused) {
                  music.play().then(() => setIcon(true)).catch(() => {});
                }
                document.removeEventListener('click', resumeOnInteract);
                document.removeEventListener('keydown', resumeOnInteract);
                document.removeEventListener('touchstart', resumeOnInteract);
              };
              document.addEventListener('click', resumeOnInteract);
              document.addEventListener('keydown', resumeOnInteract);
              document.addEventListener('touchstart', resumeOnInteract);
            });
          }
        }

        toggleBtn.addEventListener('click', () => {
          if (music.paused) {
            userPaused = false;
            music.play().then(() => setIcon(true)).catch(() => {});
          } else {
            userPaused = true;
            music.pause();
            setIcon(false);
          }
        });

        tryAutoplay();
      });
    </script>

    <script>

        if (!loader) return;
        loader.classList.add('hidden');
        document.body.classList.remove('loading');
        setTimeout(() => loader.remove(), 700);
      }

      window.addEventListener('load', () => {
        setTimeout(hideLoadingScreen, 400);
      });

      setTimeout(hideLoadingScreen, 6000);
    </script>
